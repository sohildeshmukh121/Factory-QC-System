
{% extends 'quality/base.html' %}

{% block title %}Record Inspection{% endblock %}

{% block content %}
<div class="form-card">
    <h2 class="mb-2">Record Quality Inspection</h2>
    <p class="text-muted">
        The result is calculated automatically from the tolerance limits.
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-success" type="submit">
            Save Inspection
        </button>
        <a class="btn btn-secondary"
           href="{% url 'inspection_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
