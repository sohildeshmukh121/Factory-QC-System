
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Factory QC{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'quality/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            Factory QC System
        </a>
        <span class="text-white">Production & Quality Control</span>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 sidebar p-3">
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'job_list' %}">Production Jobs</a>
                <a href="{% url 'inspection_list' %}">Inspections</a>
                <a href="{% url 'dispatch_clearance' %}">Dispatch Clearance</a>
                <a href="/admin/">Admin Panel</a>
            </aside>

            <main class="col-md-10 p-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
